<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game | Show and tell saturday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <main>
    <!-- stats -->
    <div class="top">
        <div class="info">
          <h3 class="high-score">High Score :</h3><span></span>
        </div>

         <div class="info">
             <h3 class="score">Score : 00</h3> 
            

         </div>
          <div class="info">
             <h3 class="time">Time :</h3>
             <span id="time"> 00:00</span>
          </div>
    </div>
    <!-- board -->
    <div class="bottom"></div>


    <!-- start game page -->
     <section class="card">
    <p class="welcome">— Welcome to —</p>
    <h1 class="title">Snake Game</h1>
    <button class="start-btn">▶ Start Game</button>
    <p class="developer">Developed by <span>Rohit Pokhariya</span></p>
  </section>

  <!-- Game over page -->
   <section class="game-over">
    <div class="content">
       <h3>Game Over</h3>
       <!-- <h2>Your score is </h2> -->
    <button class="restart">Restart Game</button>
   </section>
    </div>
  </main>



    <script src="script.js"></script>
</body>
</html>
